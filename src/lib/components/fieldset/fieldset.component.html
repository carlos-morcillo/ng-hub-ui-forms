<ng-template #body>
	@if (legend() || legendTmp() || _projectedLegend()) {
		<legend class="hub-fieldset__legend">
			<ng-content select="hub-legend"></ng-content>
			@if (!_projectedLegend()) {
				@if (legendTmp(); as tpl) {
					<ng-container [ngTemplateOutlet]="tpl"></ng-container>
				} @else {
					<hub-legend>{{ legend() }}</hub-legend>
				}
			}
		</legend>
	}

	<div class="hub-fieldset__content">
		<ng-content></ng-content>
	</div>

	@if (isInvalid) {
		<div class="hub-field__feedback" role="alert">
			<ul>
				@for (error of errors | keyvalue; track error.key) {
					<li>
						<ng-container
							[ngTemplateOutlet]="_errorTemplates[error.key] ?? defaultErrorTpt"
							[ngTemplateOutletContext]="{ $implicit: error.value, value: error.value }"
						></ng-container>
						<ng-template #defaultErrorTpt>
							<span
								class="hub-field__feedback-text"
								[innerHTML]="getInvalidFeedbackTemplate(error.key, error.value)"
							></span>
						</ng-template>
					</li>
				}
			</ul>
		</div>
	}
</ng-template>

@if (_isElementForm) {
	<fieldset class="hub-fieldset" [class.hub-fieldset--invalid]="isInvalid">
		<ng-container [ngTemplateOutlet]="body"></ng-container>
	</fieldset>
} @else {
	<ng-container [ngTemplateOutlet]="body"></ng-container>
}
